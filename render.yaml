services:
  - type: web
    name: receptionist-picktime-api
    runtime: docker
    plan: standard
    rootDir: picktime-api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PICKTIME_LIVE
        value: "1"
      - key: PICKTIME_PAGE_ID
        sync: false
      - key: TZ
        value: Asia/Kolkata
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: BROWSER_POOL_SIZE
        value: "4"
      - key: NAVIGATION_TIMEOUT_MS
        value: "10000"
      - key: ACTION_TIMEOUT_MS
        value: "5000"
